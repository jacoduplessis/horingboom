name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  DATABASE_NAME: horingboom_test
  PYTHON_THREAD_STACK_SIZE: "33554432"

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: horingboom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install Python 3.14 via uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install Python 3.14 and configure environment
        run: |
          uv python install 3.14
          PYTHON_BIN=$(uv python find 3.14)
          PYTHON_ROOT=$(dirname $(dirname $PYTHON_BIN))
          echo "PYTHONHOME=$PYTHON_ROOT" >> $GITHUB_ENV
          # Put uv Python first on PATH so cmake finds it during mix compile
          echo "$PYTHON_ROOT/bin" >> $GITHUB_PATH
          # Hint for cmake's find_package(Python3)
          echo "Python3_ROOT=$PYTHON_ROOT" >> $GITHUB_ENV

      - name: Install Python dependencies
        working-directory: python/django_app
        run: uv sync

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Compile (erlang_python NIF builds against Python 3.14 via Python3_ROOT)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run unit tests
        run: mix test

      - name: Run integration tests
        run: mix test --include integration
